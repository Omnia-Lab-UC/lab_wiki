project:
  type: website
  output-dir: _site

website:
  title: "Omnia Lab Wiki"
  site-url: https://omnia-lab-uc.github.io/lab_wiki/
  repo-url: https://github.com/Omnia-Lab-UC/lab_wiki
  repo-actions: [edit, issue]
  page-navigation: true
  search:
    location: sidebar
    type: textbox
  sidebar:
    style: floating
    collapse-level: 1
    contents:
      - index.qmd
      - contributing.qmd
      - section: "Onboarding"
        href: onboarding/index.qmd
        contents: onboarding/*.qmd
      - text: "Tutorials"
        href: tutorials/index.qmd
      - section: "Protocols"
        href: protocols/index.qmd
        contents: protocols/*.qmd
      - section: "Computing"
        href: computing/index.qmd
        contents: computing/*.qmd
      - section: "Data"
        href: data/index.qmd
        contents: data/*.qmd
      - section: "Lab Life"
        href: lab-life/index.qmd
        contents: lab-life/*.qmd
  page-footer:
    left: "Omnia Lab · UC"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [zephyr, theme.scss]
      dark: [zephyr, theme.scss, theme-dark.scss]
    grid:
      body-width: 800px
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    css: styles.css
    toc: true
    link-external-newwindow: true

execute:
  freeze: auto
